[package]
name = "local-agent"
version = "0.1.0"
edition = "2021"
description = "A local CLI coding agent powered by llama-server (OpenAI-compatible API)"

[[bin]]
name = "local-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-openai = { version = "0.38.0", default-features = false, features = ["rustls", "chat-completion"] }
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustyline = "14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
